name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  pg-verify:
    name: PostgreSQL verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      harness-postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-test-only
      SR_TEST_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5433/postgres
      HTTP_TEST_MODE: local
      SCHEMA_VERIFICATION_LOCAL_CLUSTER: "1"
      SCHEMA_VERIFICATION_CONFIRMATION: ROLLBACK_ONLY
      SCHEMA_VERIFICATION_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @super-restaurant/api... build
      - name: Bootstrap local Auth fixtures
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, email text, deleted_at timestamptz, raw_user_meta_data jsonb);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid';
          INSERT INTO auth.users(id,email) VALUES ('00000000-0000-4000-8000-000000000001','ci1@invalid.test'), ('00000000-0000-4000-8000-000000000002','ci2@invalid.test');
          SQL
      - name: Verify initial migration in rollback transaction
        run: pnpm --filter @super-restaurant/api run verify:schema:rollback
      - name: Apply migrations to a fresh database
        run: |
          : > "$RUNNER_TEMP/sql-executed"
          run_audit() {
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "supabase/tests/$1"
            printf '%s\n' "$1" >> "$RUNNER_TEMP/sql-executed"
          }
          run_invariant() {
            { printf 'BEGIN;\n'; sed -E '/^[[:space:]]*(begin|commit|rollback);[[:space:]]*$/Id' "supabase/tests/$1"; printf '\nROLLBACK;\n'; } |
              psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
            printf '%s\n' "$1" >> "$RUNNER_TEMP/sql-executed"
          }
          for file in supabase/migrations/*.sql; do
            if [[ "$file" == *20260927000100_delivery_zones.sql ]]; then run_audit delivery_zones_pre_catalog.sql; fi
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$file"
            if [[ "$file" == *20260830000100_create_tenancy_memberships.sql ]]; then
              psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "GRANT app_api TO postgres WITH ADMIN TRUE, INHERIT FALSE, SET FALSE"
            fi
            if [[ "$file" == *20260830000200_list_active_branch_memberships.sql ]]; then
              sed "s/grantor_role.rolname = 'supabase_admin'/grantor_role.rolname = 'postgres'/" supabase/tests/tenancy_memberships_catalog.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
              { printf "BEGIN; ALTER ROLE app_api LOGIN PASSWORD 'ci-test-only' VALID UNTIL 'infinity';\n"; sed "s/grantor_role.rolname = 'supabase_admin'/grantor_role.rolname = 'postgres'/" supabase/tests/tenancy_memberships_runtime_catalog.sql; printf "\nROLLBACK;\n"; } |
                psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
            fi
            if [[ "$file" == *20260831000100_create_dining_zones.sql ]]; then
              sed "s/grantor_role.rolname = 'supabase_admin'/grantor_role.rolname = 'postgres'/" supabase/tests/tenancy_memberships_post_dining_zones_catalog.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
              { printf "BEGIN; ALTER ROLE app_api LOGIN PASSWORD 'ci-test-only' VALID UNTIL 'infinity';\n"; sed "s/grantor_role.rolname = 'supabase_admin'/grantor_role.rolname = 'postgres'/" supabase/tests/tenancy_memberships_post_dining_zones_runtime_catalog.sql; printf "\nROLLBACK;\n"; } |
                psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
            fi
            case "$file" in
              *20260831000100*) audits="dining_zones_catalog.sql" ;;
              *20260901000100*) audits="dining_tables_layout_catalog.sql tenancy_memberships_post_dining_tables_catalog.sql" ;;
              *20260902000100*) audits="menu_catalog_catalog.sql tenancy_memberships_post_menu_catalog.sql" ;;
              *20260902000200*) audits="orders_realtime_catalog.sql tenancy_memberships_post_orders_realtime.sql" ;;
              *20260903000100*) audits="kds_ticket_catalog.sql tenancy_memberships_post_kds.sql" ;;
              *20260903000200*) audits="cash_registers_simple_payments_catalog.sql" ;;
              *20260903000300*) audits="cash_register_operational_reporting_catalog.sql tenancy_memberships_post_finance.sql" ;;
              *20260905000200*) audits="operational_order_shift_catalog.sql" ;;
              *20260905000300*) audits="order_item_cancellations_catalog.sql" ;;
              *20260906000100*) audits="menu_orderability_catalog.sql" ;;
              *20260906000200*) audits="restaurant_time_zone_catalog.sql tenancy_memberships_post_p2.sql" ;;
              *20260916000800*) audits="capture_drafts_catalog.sql customer_directory_catalog.sql" ;;
              *20260922000200*) audits="capture_delivery_order_catalog.sql" ;;
              *20260923000100*) audits="customer_order_history_catalog.sql" ;;
              *20260923000200*) audits="capture_repeat_order_catalog.sql" ;;
              *20260923000300*) audits="capture_repeat_order_workspace_catalog.sql" ;;
              *20260924000100*) audits="capture_repeat_order_confirmation_catalog.sql" ;;
              *20260924000200*) audits="capture_assignment_catalog.sql" ;;
              *20260927000100*) audits="delivery_zones_catalog.sql" ;;
              *) audits="" ;;
            esac
            for audit in $audits; do run_audit "$audit"; done
            if [[ "$file" == *20261007000500_branch_day_summary.sql ]]; then
              run_invariant branch_day_summary_invariants.sql
            fi
          done
      - name: Run SQL tests
        run: |
          failed=0
          for file in supabase/tests/*.sql; do
            case "$file" in */tenancy_memberships_catalog.sql|*/tenancy_memberships_runtime_catalog.sql|*/tenancy_memberships_post_dining_zones_catalog.sql|*/tenancy_memberships_post_dining_zones_runtime_catalog.sql) continue ;; esac
            if grep -Fxq "$(basename "$file")" "$RUNNER_TEMP/sql-executed"; then continue; fi
            echo "Testing $file"
            if [[ "$file" == */capture_delivery_order_invariants.sql ]]; then
              # Match run-capture-delivery-order-schema-verification: fixtures inspect app tables as postgres.
              if sed -e "s/execute 'set local role app_api';//g" -e "s/execute 'reset role';//g" "$file" |
                psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1; then
                passed=1
              else
                passed=0
              fi
            elif psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$file"; then
              passed=1
            else
              passed=0
            fi
            if [[ "$passed" == 0 ]]; then
              echo "::error file=$file::SQL test failed"
              failed=1
            fi
          done
          echo "sql tests failed=$failed"
          [ "$failed" -eq 0 ]
      # Other rollback verifiers embed a Windows-only PostgreSQL executable or expect
      # a specific pre-migration Supabase catalog; these two use LocalPostgres.
      - name: Run compatible rollback verifiers
        run: |
          pnpm --filter @super-restaurant/api run verify:capture-selection-plan-schema:rollback
          pnpm --filter @super-restaurant/api run verify:pizza-model-v2-schema:rollback
          pnpm --filter @super-restaurant/api run verify:cash-transfer-method-schema:rollback
      - name: Run local HTTP flow
        run: pnpm --filter @super-restaurant/api run test:http:local -- --local-disposable-only

  e2e-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      SR_TEST_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres
      SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
      API_BASE_URL: http://127.0.0.1:3000
      WEB_ORIGIN: http://127.0.0.1:8082
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @super-restaurant/api... build
      - run: pnpm --filter @super-restaurant/web exec playwright install --with-deps chromium
      - run: pnpm --filter @super-restaurant/web exec playwright test --config playwright.ci.config.ts
